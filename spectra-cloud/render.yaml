services:
  - type: web
    name: spectra-beta-api
    runtime: python
    rootDir: spectra-cloud
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SPECTRA_FRONTEND_ORIGIN
        value: https://spectra-psi-eight.vercel.app
